services:
  postgres:
    image: postgres:16-alpine
    container_name: progress-meter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-progress}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-progress}
      POSTGRES_DB: ${DB_DATABASE:-progress_meter}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-progress} -d ${DB_DATABASE:-progress_meter}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
