name: progress_meter
description: A local-first student workspace for academic and career progress.
publish_to: none
version: 1.8.0+11
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  excel_community: ^2.6.2
  archive: ^4.0.9
  crypto: ^3.0.8
  xml: ^7.0.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
